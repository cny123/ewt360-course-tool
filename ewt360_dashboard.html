<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172c3c">
  <title>学习任务控制台</title>
  <style>
    :root { --ink:#17212b; --muted:#65747e; --line:#d9e0e5; --bg:#f3f6f7; --teal:#087e78; --navy:#172c3c; --green:#25734b; --amber:#a96900; --red:#b44343; }
    * { box-sizing:border-box; } body { margin:0; min-width:0; color:var(--ink); background:var(--bg); font:14px/1.45 "Microsoft YaHei","Segoe UI",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .top { height:58px; padding:0 26px; display:flex; justify-content:space-between; align-items:center; color:#fff; background:var(--navy); border-bottom:3px solid #0e9188; }
    .brand { font-weight:700; font-size:16px; } .brand b { display:inline-grid; place-items:center; width:28px; height:28px; margin-right:10px; color:var(--navy); background:#55d0c6; } .online { color:#a5e9d9; font-size:12px; }
    .layout { max-width:1500px; margin:auto; padding:18px; display:grid; grid-template-columns:282px minmax(650px,1fr); gap:18px; }
    .panel { margin-bottom:16px; border:1px solid var(--line); background:#fff; box-shadow:0 1px 2px #17212b0d; }
    .title { padding:11px 14px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; background:#f8fafb; border-bottom:1px solid var(--line); }
    .body { padding:14px; } label { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; } .field { margin-bottom:11px; }
    input,select { width:100%; height:35px; padding:0 9px; border:1px solid #cbd5db; outline:0; } input:focus,select:focus { border-color:var(--teal); box-shadow:0 0 0 2px #dff3ef; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .btn { min-height:35px; padding:7px 10px; border:1px solid #b7c5cc; color:#26353f; background:#fff; font-weight:600; } .btn:hover { background:#f0f5f6; } .btn.primary { border-color:var(--teal); color:#fff; background:var(--teal); } .btn.danger { color:var(--red); border-color:#dbb1b1; }
    .account { display:flex; align-items:center; gap:10px; } .avatar { width:31px; height:31px; display:grid; place-items:center; color:#fff; background:#4e7188; font-weight:700; } .account small { color:var(--muted); } .dot { width:8px; height:8px; border-radius:50%; background:#3da565; margin-left:auto; }
    .side-note { margin-top:12px; color:var(--muted); font-size:12px; } .run { border-left:3px solid #2173ba; } .runline { display:flex; justify-content:space-between; margin-top:9px; color:var(--muted); font-size:12px; } .runline strong { color:var(--ink); }
    .head { display:flex; justify-content:space-between; align-items:flex-start; margin:3px 0 16px; } h1 { margin:0; font-size:22px; } .subtitle { margin-top:4px; color:var(--muted); } .head .btn { margin-left:7px; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; } .metric { padding:13px 14px; background:#fff; border:1px solid var(--line); border-top:3px solid #aab7bf; } .metric.teal { border-top-color:var(--teal); } .metric.green { border-top-color:var(--green); } .metric.amber { border-top-color:#d89b2d; } .metric.red { border-top-color:var(--red); } .num { font-size:25px; font-weight:700; } .metric small { color:var(--muted); }
    .toolbar { padding:9px 14px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line); } .tab { padding:7px 10px; border:0; border-bottom:2px solid transparent; color:var(--muted); background:transparent; font-weight:600; } .tab.active { color:var(--teal); border-bottom-color:var(--teal); } .toolbar select { width:120px; height:31px; font-size:12px; }
    table { width:100%; border-collapse:collapse; } th { padding:9px 14px; color:var(--muted); background:#f7f9fa; border-bottom:1px solid var(--line); text-align:left; font-size:11px; } td { padding:11px 14px; border-bottom:1px solid #edf0f2; } tr:hover td { background:#f8fcfc; } .course { font-weight:600; } .id { margin-top:2px; color:#89969e; font:11px Consolas,monospace; }
    .ptext { display:flex; justify-content:space-between; margin-bottom:5px; color:#53626b; font-size:11px; } .bar { height:6px; background:#e7edef; } .bar span { display:block; height:100%; background:var(--teal); } .bar.done span { background:var(--green); } .pill { display:inline-block; padding:3px 7px; border:1px solid; font-size:11px; font-weight:600; } .pill.todo { color:var(--amber); border-color:#edd295; background:#fff1d5; } .pill.done { color:var(--green); border-color:#abd7ba; background:#e1f3e8; } .pill.risk { color:var(--red); border-color:#e4b1b1; background:#fbe8e8; }
    .bottom { display:grid; grid-template-columns:1.55fr 1fr; gap:16px; } .log { height:205px; overflow:auto; padding:10px 12px; color:#c9d8df; background:#15232d; font:12px/1.65 Consolas,"Courier New",monospace; } .log .time { color:#6f8b9a; } .ok { color:#71d7a2; } .warn { color:#f2bf55; }
    .queue { padding:0; margin:0; list-style:none; } .queue li { display:flex; gap:9px; padding:10px 14px; border-bottom:1px solid #edf0f2; } .queue i { color:#8b989f; font:12px Consolas,monospace; font-style:normal; } .queue span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:12px; } .queue small { color:var(--muted); }
    @media (max-width:760px) {
      body { font-size:13px; }
      .top { min-height:56px; height:auto; padding:10px 14px; gap:8px; align-items:flex-start; }
      .brand { font-size:15px; line-height:28px; }
      .online { max-width:42%; padding-top:4px; text-align:right; line-height:1.25; }
      .layout { display:block; padding:12px; }
      .panel { margin-bottom:12px; }
      .body { padding:12px; }
      input,select,.btn { min-height:42px; }
      input,select { height:42px; }
      .buttons { gap:8px; }
      .head { display:block; margin:0 0 12px; }
      h1 { font-size:20px; }
      .head > div:last-child { display:flex; gap:8px; margin-top:10px; }
      .head .btn { flex:1; margin-left:0; }
      .metrics { grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
      .metric { padding:10px 11px; }
      .num { font-size:22px; }
      .toolbar { display:flex; gap:8px; padding:8px 10px; overflow:hidden; }
      .toolbar > div { display:flex; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
      .toolbar > div::-webkit-scrollbar { display:none; }
      .tab { flex:0 0 auto; min-height:38px; padding:6px 9px; }
      .toolbar select { flex:0 0 108px; width:108px; min-height:38px; height:38px; }
      table,tbody,tr,td { display:block; }
      thead { display:none; }
      tr { padding:9px 12px; border-bottom:1px solid var(--line); }
      td { display:grid; grid-template-columns:58px minmax(0,1fr); gap:8px; align-items:center; padding:6px 0; border:0; }
      td::before { content:attr(data-label); color:var(--muted); font-size:11px; }
      td:first-child { display:block; padding-top:2px; }
      td:first-child::before,td[colspan]::before { display:none; }
      td[colspan] { display:block; }
      td:last-child { display:flex; justify-content:flex-end; padding-bottom:2px; }
      td:last-child::before { display:none; }
      td:last-child .btn { min-height:36px; }
      .course { font-size:14px; overflow-wrap:anywhere; }
      .bottom { display:block; }
      .log { height:180px; }
      .queue li { padding:10px 12px; }
    }
    @media (max-width:480px) {
      .top { display:block; }
      .online { max-width:none; padding:2px 0 0 38px; text-align:left; }
      .layout { padding:8px; }
      .title { padding:10px 12px; }
      .buttons { grid-template-columns:1fr; }
      .head > div:last-child { display:grid; grid-template-columns:1fr 1fr; }
      .metrics { gap:6px; }
      .metric { padding:9px 10px; }
      .num { font-size:20px; }
      .toolbar { display:block; }
      .toolbar > div { margin-bottom:7px; }
      .toolbar select { width:100%; }
    }
  </style>
</head>
<body>
  <header class="top"><div class="brand"><b>E</b>学习任务控制台</div><div class="online">● 本地界面原型 · 离线演示</div></header>
  <div class="layout">
    <aside>
      <section class="panel"><div class="title">账户登录</div><div class="body">
        <div class="field"><label>账号</label><input id="account" placeholder="请输入账号"></div>
        <div class="field"><label>密码</label><input id="password" type="text" placeholder="请输入密码"></div>
        <div class="buttons"><button class="btn primary" id="login">登录</button><button class="btn" id="scan">扫描任务</button></div>
      </div></section>
      <section class="panel"><div class="title">已登录账户 <span id="accountCount">0</span></div><div class="body" id="accountBox"><span class="side-note">登录后显示当前会话</span></div></section>
      <section class="panel run"><div class="title">运行控制</div><div class="body">
        <div class="field"><label>执行模式</label><select id="mode"><option>只读诊断</option><option>快速验证</option><option>BFE 真实计时</option></select></div>
        <div class="buttons"><button class="btn primary" id="run">开始运行</button><button class="btn danger" id="stop">停止</button></div>
        <div class="runline"><span>当前状态</span><strong id="state">待命</strong></div><div class="runline"><span>处理队列</span><strong id="runQueue">0 / 0</strong></div>
      </div></section>
    </aside>
    <main>
      <div class="head"><div><h1>课程任务</h1><div class="subtitle" id="hint">请登录后扫描课程任务</div></div><div><button class="btn" id="diagnose">只读诊断</button><button class="btn primary" id="refresh">刷新列表</button></div></div>
      <section class="metrics"><div class="metric teal"><div class="num" id="total">0</div><small>全部课程</small></div><div class="metric green"><div class="num" id="done">0</div><small>已达标</small></div><div class="metric amber"><div class="num" id="todo">0</div><small>待处理</small></div><div class="metric red"><div class="num" id="risk">0</div><small>风控/异常</small></div></section>
      <section class="panel"><div class="toolbar"><div><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="todo">待处理</button><button class="tab" data-filter="done">已达标</button><button class="tab" data-filter="risk">异常</button></div><select id="subject"><option value="all">全部学科</option><option>语文</option><option>数学</option><option>英语</option><option>物理</option></select></div>
        <table><thead><tr><th>课程</th><th>进度</th><th>状态</th><th>模式</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="side-note">暂无课程。点击“扫描任务”查看演示数据。</td></tr></tbody></table>
      </section>
      <div class="bottom"><section class="panel"><div class="title">运行日志 <button class="btn" id="clear">清空</button></div><div class="log" id="log"><div><span class="time">00:00:00</span> 等待操作。</div></div></section><section class="panel"><div class="title">待处理队列 <span id="queueCount">0</span></div><ul class="queue" id="queue"><li><span class="side-note">扫描后显示待处理课程</span></li></ul></section></div>
    </main>
  </div>
  <script>
    var sample=[
      {id:"117980",title:"语文开学第一课",subject:"语文",percent:47,state:"todo",mode:"BFE"},
      {id:"65169",title:"数学开学第一课",subject:"数学",percent:0,state:"todo",mode:"BFE"},
      {id:"71304",title:"乘法公式",subject:"数学",percent:0,state:"todo",mode:"快速验证"},
      {id:"81721",title:"英语开学第一课",subject:"英语",percent:0,state:"risk",mode:"待检查"},
      {id:"90514",title:"物理开学第一课",subject:"物理",percent:100,state:"done",mode:"已完成"},
      {id:"104857",title:"春花秋月，词有芬芳",subject:"语文",percent:100,state:"done",mode:"已完成"}
    ],courses=[],filter="all";
    function el(id){return document.getElementById(id)} function now(){return new Date().toLocaleTimeString("zh-CN",{hour12:false})}
    function log(msg,cls){var x=el("log");x.innerHTML+='<div><span class="time">'+now()+'</span> <span class="'+(cls||"")+'">'+msg+'</span></div>';x.scrollTop=x.scrollHeight}
    function label(s){return s==="done"?["已达标","done"]:s==="risk"?["需检查","risk"]:["待处理","todo"]}
    async function api(path, options) {
      var response = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, options || {}));
      var data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "请求失败");
      return data;
    }
    function applyState(state) {
      courses = (state.lessons || []).map(function(c) {
        var percent = Number(c.percent || 0);
        return Object.assign({}, c, {
          state: c.finished || percent >= 80 ? "done" : "todo",
          mode: c.contentType === 2 ? "试题" : "BFE"
        });
      });
      if (state.loggedIn) {
        el("accountCount").textContent = "1";
        el("accountBox").innerHTML = '<div class="account"><div class="avatar">E</div><div><div>当前账户</div><small>schoolId='+state.schoolId+' · userId='+state.userId+'</small></div><div class="dot"></div></div>';
      }
      if (state.job) {
        el("state").textContent = state.job.state || "待命";
        el("runQueue").textContent = (state.job.done || 0)+" / "+(state.job.total || 0);
      }
      if (state.logs && state.logs.length) {
        el("log").innerHTML = state.logs.slice(-80).map(function(item) {
          return '<div><span class="time">'+now()+'</span> <span class="'+(item.level==="WARN"||item.level==="ERR"?"warn":"ok")+'">'+item.message+'</span></div>';
        }).join("");
      }
      render();
    }
    async function refreshState() {
      try { var data = await api("/api/state"); applyState(data.state); } catch (error) { log(error.message, "warn"); }
    }
    function render(){
      var sub=el("subject").value,show=courses.filter(function(c){return (filter==="all"||c.state===filter)&&(sub==="all"||c.subject===sub)});
      el("rows").innerHTML=show.length?show.map(function(c){var a=label(c.state);return '<tr><td data-label="课程"><div class="course">'+c.title+'</div><div class="id">'+c.subject+' · lessonId='+c.id+'</div></td><td data-label="进度"><div class="ptext"><span>'+c.percent+'%</span><span>'+(c.percent>=80?"已满足目标":"目标 80%")+'</span></div><div class="bar '+(c.state==="done"?"done":"")+'"><span style="width:'+c.percent+'%"></span></div></td><td data-label="状态"><span class="pill '+a[1]+'">'+a[0]+'</span></td><td data-label="模式">'+c.mode+'</td><td data-label="操作"><button class="btn" onclick="inspectCourse(\''+c.id+'\')">查看</button></td></tr>'}).join(""):'<tr><td colspan="5" class="side-note">没有符合条件的课程</td></tr>';
      var done=courses.filter(function(c){return c.state==="done"}).length,todo=courses.filter(function(c){return c.state==="todo"}).length,risk=courses.filter(function(c){return c.state==="risk"}).length;
      el("total").textContent=courses.length;el("done").textContent=done;el("todo").textContent=todo;el("risk").textContent=risk;
      var q=courses.filter(function(c){return c.state!=="done"});el("queueCount").textContent=q.length;el("queue").innerHTML=q.length?q.slice(0,5).map(function(c,i){return '<li><i>0'+(i+1)+'</i><span>'+c.title+'</span><small>'+c.percent+'%</small></li>'}).join(""):'<li><span class="side-note">暂无待处理课程</span></li>';
    }
    window.inspectCourse=function(id){var c=courses.filter(function(x){return x.id===id})[0];log("查看课程："+c.title+"，当前进度 "+c.percent+"%。","ok")}
    async function scan(){try{var data=await api("/api/scan",{method:"POST",body:"{}"});applyState(data.state);el("hint").textContent="已扫描 "+courses.length+" 门课程";log("扫描完成：发现 "+courses.length+" 门课程。","ok")}catch(error){log(error.message,"warn")}}
    el("login").onclick=async function(){try{var account=el("account").value.trim(),password=el("password").value;if(!account||!password){log("请输入账号和密码。","warn");return}var data=await api("/api/login",{method:"POST",body:JSON.stringify({account:account,password:password})});applyState(data.state);el("hint").textContent="已登录。点击扫描任务加载课程。";log("登录成功。","ok")}catch(error){log(error.message,"warn")}}
    el("scan").onclick=scan;el("refresh").onclick=scan;
    el("diagnose").onclick=async function(){try{var data=await api("/api/run",{method:"POST",body:JSON.stringify({mode:"diagnose"})});applyState(data.state);log("已启动只读诊断。","ok")}catch(error){log(error.message,"warn")}}
    el("run").onclick=async function(){try{var mode=el("mode").value==="BFE 真实计时"?"bfe":el("mode").value==="快速验证"?"fast":"diagnose";var data=await api("/api/run",{method:"POST",body:JSON.stringify({mode:mode})});applyState(data.state);log("已启动 "+mode+"。","ok")}catch(error){log(error.message,"warn")}}
    el("stop").onclick=async function(){try{var data=await api("/api/stop",{method:"POST",body:"{}"});applyState(data.state);log("已请求停止任务。","warn")}catch(error){log(error.message,"warn")}}
    el("clear").onclick=function(){el("log").innerHTML='<div><span class="time">'+now()+'</span> 日志已清空。</div>'}
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){t.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.remove("active")});t.classList.add("active");filter=t.dataset.filter;render()}})
    el("subject").onchange=render;
    refreshState();
    setInterval(refreshState, 2000);
  </script>
</body>
</html>
